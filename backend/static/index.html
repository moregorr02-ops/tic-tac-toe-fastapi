<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Крестики-нолики</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

        <h1>Крестики-нолики</h1>

</div>
        <div id="board"></div>

        <div id="message"></div>
